name: $(System.TeamProject)-Automation-Platform-API-v0.0.1-$(Build.BuildId)

pr: none

trigger:
  branches:
    include:
      - main

resources:
  - repo: self

variables:
  vmImageName: 'ubuntu-latest'
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository


stages:
  - stage: test
    displayName: Test
    jobs:
      - job: test
        displayName: Run Automation Tests
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Bash@3
            inputs:
              targetType: inline
              script: |
                curl -vkL https://www.jsonip.com
                curl -vkL https://get.geojs.io/v1/ip/country.json
          - task: MavenAuthenticate@0
            displayName: 'Auth to FCI-FEED'
            inputs:
              artifactsFeeds: FCI-FEED
          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)
            displayName: Cache Maven Local Repo
          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx2048m -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'
              jdkArchitectureOpton: 'x64'
              publishJUnitResults: true
              mavenFeedAuthenticate: true
              skipEffectivePom: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              goals: 'test'

